{% extends "layout.html" %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-secondary text-light p-4 shadow">
            <h3 class="text-center mb-4">Log In</h3>
            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Username" type="text" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Log In</button>
            </form>
            <div class="text-center mt-3">
                <small>Don't have an account? <a href="/register" class="text-warning">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
