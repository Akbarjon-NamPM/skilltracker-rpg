{% extends "layout.html" %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-secondary text-light p-4 shadow">
            <h3 class="text-center mb-4">Create Account</h3>
            <form action="/register" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Choose a username" type="text" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input class="form-control" id="password" name="password" placeholder="Choose a password" type="password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmation" class="form-label">Confirm Password</label>
                    <input class="form-control" id="confirmation" name="confirmation" placeholder="Re-enter password" type="password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Register</button>
            </form>
            <div class="text-center mt-3">
                <small>Already have an account? <a href="/login" class="text-warning">Log in here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
